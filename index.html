<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b4f"><title>Joker Scorer</title>
<style>
:root{--g:#0b6b4f;--g2:#0f7f5f;--p:#f1f5f3;--d:#c3d3ca;--r:#c0392b;--b:#1565c0}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#fff;color:#1a1a1a;padding:10px;padding-bottom:env(safe-area-inset-bottom)}
h1{color:var(--g);text-align:center;margin:6px 0;font-size:26px}h2{color:var(--g);font-size:16px;margin:4px 0;text-align:center}
.card{background:var(--p);border:1px solid var(--d);border-radius:10px;padding:12px;margin:10px auto;max-width:520px}
label{display:block;margin:8px 0 3px;font-weight:bold;color:var(--g)}input,select{width:100%;padding:10px;font:inherit;border:1px solid var(--d);border-radius:8px}
.b{background:var(--g);color:#fff;border:2px solid var(--g);border-radius:8px;padding:10px 16px;font:bold 15px Georgia,serif;cursor:pointer}
.b:hover{background:var(--g2)}.b.gh{background:#fff;color:var(--g)}.b:disabled{background:#e3e8e5;color:#9aa7a0;border-color:#e3e8e5;cursor:default}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}.wide{width:100%;margin-top:8px}
.tw{overflow:auto;border:1px solid var(--d);border-radius:14px;max-height:46vh;background:#fff;box-shadow:0 3px 12px rgba(11,107,79,.15)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;text-align:center}th{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:9px 4px;position:sticky;top:0;z-index:2}
td{padding:7px 4px;white-space:nowrap;border-bottom:1px solid #e6eeea}
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.box{background:#fff;border:1px solid var(--d);border-radius:14px;text-align:center;padding:8px 3px 7px;font-size:12px;box-shadow:0 2px 8px rgba(11,107,79,.12);min-width:0}
.box .bn{font-size:12px;color:#5c6b64;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.box b{display:block;font-size:22px;color:var(--g);margin:1px 0 5px;line-height:1.1}
.pips{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;min-height:8px;margin-bottom:6px}
.pips i{width:6px;height:6px;border-radius:50%;border:1px solid #b9c8c0;box-sizing:border-box}
.pips i.h{background:var(--g);border-color:var(--g)}.pips i.x{background:var(--r);border-color:var(--r)}
.st{display:inline-block;font-size:9.5px;font-weight:bold;padding:2px 6px;border-radius:10px;letter-spacing:.2px;white-space:nowrap}
.box.on{border:2px solid #0b6b4f;background:linear-gradient(#f4fbf7,#e1f3ea);box-shadow:0 0 0 3px rgba(11,107,79,.18),0 2px 8px rgba(0,0,0,.1);padding:7px 2px 6px}
.box.on .st{background:#0b6b4f;color:#fff}
.box.lost .st{background:#fdecea;color:#b23a2c}.box.lost b{color:#6b7a73}
.box.open .st{background:#eef2f0;color:#5c6b64}.mut{color:#5c6b64}
.teams{display:flex;justify-content:space-around;background:var(--p);border:2px solid var(--g);border-radius:8px;padding:6px;text-align:center;font-size:13px}.teams b{display:block;font-size:26px;color:var(--g)}
.bal{text-align:center;border:2px solid;border-radius:8px;padding:4px 20px;margin:8px auto;width:max-content;font-weight:bold;font-size:20px}.bal small{display:block;font:italic 12px Georgia}
#hint{text-align:center;color:var(--g);font-weight:bold;margin:6px 0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9}
#ov[hidden]{display:none}
.dlg{background:#fff;border-radius:12px;padding:16px;width:min(94vw,420px);text-align:center}.dlg h3{margin:0;color:var(--g);font-size:20px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}.grid .b{font-size:20px;padding:12px 0}.note{color:var(--r);font-weight:bold}
.chk{display:flex;gap:6px;align-items:center;margin:4px 0}.chk input{width:auto}
[hidden]{display:none!important}
/* ---- top bar + hidden menu ---- */
.top{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#0b6b4f,#0f7f5f);color:#fff;margin:-10px -10px 10px;padding:6px 8px 6px 14px;padding-top:calc(6px + env(safe-area-inset-top));box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ttl{font-size:20px;font-weight:bold;letter-spacing:1px}
.mb{background:transparent;border:0;color:#fff;font-size:26px;line-height:1;width:44px;height:44px;border-radius:10px;cursor:pointer}.mb:active{background:rgba(255,255,255,.2)}
#mn{position:absolute;right:10px;top:calc(100% - 4px);background:#fff;border:1px solid var(--d);border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.28);overflow:hidden;min-width:190px}
#mn button{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #e6eeea;padding:14px 16px;font:bold 15px Georgia,serif;color:var(--g);cursor:pointer}#mn button:last-child{border-bottom:0}#mn button:active{background:var(--p)}
/* ---- score table ---- */
table.sc td b{display:block;font-size:16px;line-height:1.15}
table.sc small{display:block;font-size:11px;font-weight:normal;color:#5c6b64;margin-top:1px}
table.sc th small{color:#cfeadf;margin-top:0}
.pn{display:block;max-width:78px;margin:0 auto;overflow:hidden;text-overflow:ellipsis}
table.sc td.hit{background:#e8f6ee}table.sc td.hit b{color:#0b6b4f}
table.sc td.miss{background:#fff2ef}table.sc td.miss b{color:#b23a2c}
table.sc td:first-child,table.sc th:first-child{position:sticky;left:0;z-index:1;background:#f3f8f5;border-right:1px solid #dbe6e0}
table.sc th:first-child{z-index:3;background:var(--g)}
.bd{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;font-weight:bold;font-size:15px}
table.sc td.tm{background:#f3f8f5;font-weight:bold;color:var(--g);font-size:15px}
table.sc tr.tot td{background:#0a4a38;color:#fff;border-bottom:0}
table.sc tr.tot td:first-child{background:#073a2c}
table.sc tr.tot b{color:#f2d479}
table.sc tr.tot small{color:#bfe3d3}
.tl{display:block;font-size:12px;font-weight:bold;letter-spacing:1px;color:#f2d479}
.pl{display:inline-block;font-style:normal;font-size:11px;font-weight:bold;padding:1px 7px;border-radius:10px;margin-top:2px}
.pl.up{background:#f2d479;color:#3a2f00}.pl.dn{background:#c0392b;color:#fff}
table.sc tr.live td{background:#fff8e6;border-top:2px dashed #e0a020}
table.sc tr.live td:first-child{background:#ffefc4}
table.sc tr.live b{color:#b35a00}
</style></head><body>
<header class="top"><span class="ttl">♠ ♥ JOKER ♦ ♣</span><button id="mb" class="mb" onclick="tog(event)" aria-label="Menu">☰</button><nav id="mn" hidden><button onclick="menu('stats')">📊 Statistics</button><button onclick="menu('new')">➕ New game</button></nav></header><div id="app"></div><div id="ov" hidden></div>
<script>
const PARTS=[[1,2,3,4,5,6,7,8],[9,9,9,9],[8,7,6,5,4,3,2,1],[9,9,9,9]],R=[];
PARTS.forEach((p,i)=>p.forEach((c,j)=>R.push({n:R.length+1,part:i,cards:c,last:j==p.length-1})));
const $=s=>document.querySelector(s),ORD=['1st','2nd','3rd','4th'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>{let t=(v/100).toFixed(2).replace(/0+$/,'').replace(/\.$/,'');return t=='-0'||t==''?'0':t};
const bl=n=>n==0?'Pass':''+n,sum=a=>a.reduce((x,y)=>x+(y||0),0),team=v=>[v[0]+v[2],v[1]+v[3]];
const order=r=>[0,1,2,3].map(s=>(r+s)%4);
const score=(b,t,c,pen)=>b>0&&t==0?-pen:b!=t?t*10:b==0?50:b==c?c*100:100+(b-1)*50;
const balText=(t,c)=>t>c?'OVER '+(t-c):t<c?'EXTRA '+(c-t):'';
const pill=a=>a>0?`<i class="pl up">+${fmt(a)} ★</i>`:a<0?`<i class="pl dn">${fmt(a)} cut</i>`:'';
const td=(r,x)=>r.k=='t'?`<td><b>${x.v}</b>${pill(x.a)}</td>`
 :r.k=='l'?`<td><b>${x.b==null?'·':bl(x.b)}</b><small>${x.t==null?'taken …':'taken '+x.t}</small></td>`
 :`<td class="${x.b==x.t?'hit':'miss'}"><b>${x.s}</b><small>${bl(x.b)} / ${x.t}</small></td>`;
function tableHTML(rows,N,T){
 const head=N.map((n,p)=>`<th><span class="pn">${esc(n)}</span>${T?`<small>Team ${p%2+1}</small>`:''}</th>`).join('')+(T?'<th>Team 1</th><th>Team 2</th>':'');
 const body=rows.map(r=>`<tr class="${r.k=='t'?'tot':r.k=='l'?'live':''}"><td>${r.k=='t'?`<span class="tl">TOTAL</span><small>${r.sub}</small>`:`<span class="bd">${r.c}</span>`}</td>${r.cells.map(x=>td(r,x)).join('')}${T?`<td class="tm">${r.t[0]}</td><td class="tm">${r.t[1]}</td>`:''}</tr>`).join('');
 return`<table class="sc"><thead><tr><th>Cards</th>${head}</tr></thead><tbody>${body}</tbody></table>`}
function adj(ps,hs,aff,tm){const pr=[0,1,2,3].filter(p=>hs[p].length&&hs[p].every(x=>x)),a=[0,0,0,0];
 pr.forEach(p=>a[p]=Math.max(...ps[p]));
 if(pr.length==1)for(let p=0;p<4;p++)if(p!=pr[0]&&!(tm&&p%2==pr[0]%2)){let c=Math.max(...ps[p]);if(aff)c+=ps[p][ps[p].length-1];a[p]=-c}return a}
let S=null,G=JSON.parse(localStorage.getItem('joker_games')||'[]');
const keep=()=>localStorage.setItem('joker_state',JSON.stringify(S));
try{S=JSON.parse(localStorage.getItem('joker_state'))}catch(e){}
function box(msg,yes,no){return new Promise(res=>{const ov=$('#ov');ov.hidden=false;
 ov.innerHTML=`<div class="dlg"><div style="white-space:pre-line;margin:6px 0 14px;font-size:16px">${esc(msg)}</div><div class="row"><button class="b" id="by">${yes||'OK'}</button>${no?`<button class="b gh" id="bn">${no}</button>`:''}</div></div>`;
 const c=v=>{ov.hidden=true;ov.innerHTML='';res(v)};$('#by').onclick=()=>c(true);if(no)$('#bn').onclick=()=>c(false)})}
async function delAll(){if(await box('Delete ALL saved games?','Delete','Cancel')){G=[];localStorage.removeItem('joker_games');stats()}}
function setup(){S=null;$('#app').innerHTML=`<div class="card"><h2>Game rules</h2>
<label>Game type</label><select id="ty"><option>Individual</option><option>Teams</option></select>
<div class="mut" style="font-size:12px">Teams: Player 1 &amp; 3 vs Player 2 &amp; 4</div>
<label>Last score rule</label><select id="af"><option value="1">Affected</option><option value="0">Not affected</option></select>
<label>Penalty score</label><select id="pm" onchange="$('#pe').disabled=this.value=='c'"><option value="f">Fixed penalty (number below)</option><option value="c">100 × cards dealt (round 1 = 100, round 2 = 200 …)</option></select><input id="pe" type="number" value="0" min="0" step="10" style="margin-top:6px">
<label>Players</label>${[1,2,3,4].map(i=>`<input class="nm" placeholder="Player ${i}" style="margin:3px 0">`).join('')}
<button class="b wide" onclick="start()">Start game</button></div>`}
function start(){const n=[...document.querySelectorAll('.nm')].map(i=>i.value.trim());
 if(n.includes(''))return box('Please enter all 4 player names.');
 if(new Set(n.map(x=>x.toLowerCase())).size<4)return box('Each player needs a different name.');
 S={cfg:{team:$('#ty').value=='Teams',aff:$('#af').value=='1',pen:+$('#pe').value||0,penCards:$('#pm').value=='c',names:n},results:[],bids:[null,null,null,null],took:[null,null,null,null],log:[],id:Date.now(),date:new Date().toISOString().slice(0,16).replace('T',' ')};
 keep();render();setTimeout(go,300)}
function calc(){const rows=[],tot=[0,0,0,0];let ps=[[],[],[],[]],hs=[[],[],[],[]];
 S.results.forEach((r,i)=>{const I=R[i],cells=[];
  for(let p=0;p<4;p++){ps[p].push(r.scores[p]);hs[p].push(r.bids[p]==r.took[p]);tot[p]+=r.scores[p];cells.push({b:r.bids[p],t:r.took[p],s:r.scores[p]})}
  rows.push({k:'r',c:I.cards,cells,t:team(r.scores)});
  if(I.last){const a=adj(ps,hs,S.cfg.aff,S.cfg.team),pt=[],cs=[];
   for(let p=0;p<4;p++){tot[p]+=a[p];const v=sum(ps[p])+a[p];pt.push(v);cs.push({v:fmt(v),a:a[p]})}
   rows.push({k:'t',c:'TOTAL',sub:'Part '+(I.part+1),cells:cs,t:team(pt).map(fmt)});ps=[[],[],[],[]];hs=[[],[],[],[]]}});
 return{rows,tot}}
function nextStep(){const o=order(S.results.length);for(const p of o)if(S.bids[p]==null)return['bid',p];
 for(const p of o)if(S.took[p]==null)return['took',p];return null}
function render(){const N=S.cfg.names,T=S.cfg.team,k=S.results.length,done=k>=24,{rows,tot}=calc();
 if(!done&&S.bids.some(b=>b!=null)){rows.push({k:'l',c:R[k].cards,cells:[0,1,2,3].map(p=>({b:S.bids[p],t:S.took[p]})),t:['','']})}
 const part=R[Math.min(k,23)].part,tt=team(tot);
 const hd=`<h2>${done?'Game over':`${esc(N[order(k)[3]])} deals ${R[k].cards} ${R[k].cards==1?'card':'cards'}`}</h2>`,tbl=`<div class="tw">${tableHTML(rows,N,T)}</div>`;let tm='';
 if(T)tm=`<div class="teams" style="margin-top:8px">${[0,1].map(t=>`<div>TEAM ${t+1}<br>${esc(N[t])} &amp; ${esc(N[t+2])}<b style="${tt[t]==Math.max(...tt)?'':'color:#1a1a1a'}">${fmt(tt[t])}</b></div>`).join('')}</div>`;
 const bx='<div class="boxes">'+N.map((n,p)=>{const m=[];R.forEach((I,i)=>{if(I.part==part)m.push(i>=k?'o':S.results[i].bids[p]==S.results[i].took[p]?'h':'x')});
  const st=m.includes('x')?['premia lost','lost']:!m.includes('h')?['premia open','open']:m.includes('o')?['★ ON PREMIA','on']:['★ PREMIA WON','on'];
  return`<div class="box ${st[1]}"><div class="bn">${esc(n)}</div><b>${fmt(tot[p])}</b><div class="pips">${m.map(x=>`<i class="${x}"></i>`).join('')}</div><span class="st">${st[0]}</span></div>`}).join('')+'</div>';
 const st=done?null:nextStep();let bal='';
 if(st&&S.bids.every(b=>b!=null)){const t=balText(sum(S.bids),R[k].cards);if(t){const n=+t.split(' ')[1],over=t[0]=='O',c=over?'#c0392b':'#1565c0',w=n==1?'card':'cards';
  bal=`<div class="bal" style="color:${c};background:${over?'#fdecea':'#e8f1fb'};border-color:${c}">${t}<small>${n} ${w} ${over?'will be cut from someone':n==1?'goes with someone':'go with someone'}</small></div>`}}
 let h=hd+bx+bal+tbl+tm+`<div id="hint">${done?'':st[0]=='bid'?'Next to bid: '+esc(N[st[1]]):sum(S.took)==0?'All bids are in. Play the round, then enter taken.':'Taken: '+sum(S.took)+' of '+R[k].cards}</div>
<div class="row"><button class="b gh" onclick="undo()">↶ Undo</button><button class="b" onclick="go()" ${done?'disabled':''}>${done?'Game finished':st[0]=='bid'?'Enter bid: '+esc(N[st[1]]):'Enter taken: '+esc(N[st[1]])}</button></div>`;
 $('#app').innerHTML=h;const w=$('.tw');if(w)w.scrollTop=w.scrollHeight}
function ask(kind,p){return new Promise(res=>{const k=S.results.length,I=R[k],c=I.cards,o=order(k),N=S.cfg.names,dis=new Set();
 let note='',sub,extra='';
 if(kind=='bid'){if(p==o[3]){const b=c-sum(o.slice(0,3).map(q=>S.bids[q]));if(b>=0&&b<=c){dis.add(b);note=`Cannot bid ${bl(b)} (the bids would be full)`}}
  sub=`Round ${I.n} • ${c} cards • bids ${ORD[o.indexOf(p)]}`}
 else{const rem=c-sum(S.took);for(let n=rem+1;n<=c;n++)dis.add(n);const bal=balText(sum(S.bids),c),b=S.bids[p];
  sub=`Round ${I.n} • bid: ${bl(b)} • ${rem} left`+(bal?' • '+bal:'');
  extra=`<button class="b wide" data-v="${b}" ${dis.has(b)?'disabled':''}>✓ Took as bid (${bl(b)})</button>`}
 const ov=$('#ov');ov.hidden=false;
 ov.innerHTML=`<div class="dlg"><h3>${esc(N[p])}${S.cfg.team?' (Team '+(p%2+1)+')':''} – ${kind=='bid'?'BID':'TAKEN'}</h3><div style="font-style:italic;margin-top:4px">${sub}</div><div class="note">${note}</div>
 <div class="grid">${Array.from({length:c+1},(_,n)=>`<button class="b" data-v="${n}" ${dis.has(n)?'disabled':''}>${bl(n)}</button>`).join('')}</div>${extra}
 <button class="b gh wide" data-v="x">Cancel</button></div>`;
 const close=v=>{document.removeEventListener('keydown',key);ov.hidden=true;ov.innerHTML='';res(v)};
 const key=e=>{if(e.key=='Escape')close(null);else if(/^\d$/.test(e.key)&&+e.key<=c&&!dis.has(+e.key))close(+e.key)};
 document.addEventListener('keydown',key);
 ov.querySelectorAll('button').forEach(b=>b.onclick=()=>b.dataset.v=='x'?close(null):close(+b.dataset.v))})}
async function go(){if(!S||S.results.length>=24||!$('#ov').hidden)return;let st=nextStep();if(!st)return;const ph=st[0];
 while(st&&st[0]==ph){const[k,p]=st,v=await ask(k,p);if(v==null)break;
  if(k=='bid'){S.bids[p]=v;S.log.push(['bid',p,0])}else{S.took[p]=v;S.log.push(['took',p,0]);autofill()}
  if(!S.took.includes(null)){finish();return}keep();render();st=nextStep()}}
function autofill(){const c=R[S.results.length].cards,e=order(S.results.length).filter(p=>S.took[p]==null);if(!e.length)return;
 if(sum(S.took)==c)e.forEach(p=>{S.took[p]=0;S.log.push(['took',p,1])});
 else if(e.length==1){S.took[e[0]]=c-sum(S.took);S.log.push(['took',e[0],1])}}
function finish(){const I=R[S.results.length];
 S.results.push({bids:[...S.bids],took:[...S.took],scores:S.bids.map((b,p)=>score(b,S.took[p],I.cards,S.cfg.penCards?100*I.cards:S.cfg.pen)),log:[...S.log]});
 S.bids=[null,null,null,null];S.took=[null,null,null,null];S.log=[];keep();render();
 if(S.results.length==24){save(true);const{tot}=calc(),N=S.cfg.names;let m;
  if(S.cfg.team){const t=team(tot),b=Math.max(...t),w=[0,1].filter(i=>t[i]==b).map(i=>N[i]+' & '+N[i+2]);m=w.length==2?`Tie! Both teams ${fmt(b)}`:`Winner: ${w[0]} with ${fmt(b)}`}
  else{const b=Math.max(...tot);m=`Winner: ${N.filter((n,i)=>tot[i]==b).join(', ')} with ${fmt(b)}`}
  setTimeout(()=>box(m+'\n\nSaved in Statistics.'),100)}else setTimeout(go,300)}
function undo(){if(!S)return;if(!S.log.length&&S.results.length){const r=S.results.pop();S.bids=[...r.bids];S.took=[...r.took];S.log=[...r.log]}
 while(S.log.length){const[k,p,a]=S.log.pop();S[k=='bid'?'bids':'took'][p]=null;if(!a)break}keep();render()}
function save(fin){const{tot}=calc(),N=S.cfg.names,t=team(tot),b=Math.max(...(S.cfg.team?t:tot));
 const g={id:S.id,date:S.date,team:S.cfg.team,fin,names:N,pen:S.cfg.pen,aff:S.cfg.aff,results:S.results.map((r,i)=>({n:R[i].n,part:R[i].part+1,cards:R[i].cards,bids:r.bids,took:r.took,scores:r.scores})),
  totals:tot.map(v=>v/100),teams:S.cfg.team?t.map(v=>v/100):null,
  winner:S.cfg.team?[0,1].filter(i=>t[i]==b).map(i=>N[i]+' & '+N[i+2]).join(' / '):N.filter((n,i)=>tot[i]==b).join(' / ')};
 G=G.filter(x=>x.id!=g.id);G.push(g);localStorage.setItem('joker_games',JSON.stringify(G))}
function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')}
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv'}));a.download=name;a.click()}
function exportRounds(){const r=[['game_id','date','game_type','round','part','cards','player','seat','team','bid','took','hit','score']];
 G.forEach(g=>g.results.forEach(x=>g.names.forEach((n,p)=>r.push([g.id,g.date,g.team?'Teams':'Individual',x.n,x.part,x.cards,n,p+1,g.team?p%2+1:'',x.bids[p],x.took[p],+(x.bids[p]==x.took[p]),x.scores[p]]))));dl('joker_rounds.csv',csv(r))}
function exportGames(){const r=[['game_id','date','game_type','finished','rounds_played','player1','player2','player3','player4','total_p1','total_p2','total_p3','total_p4','team1_total','team2_total','winner']];
 G.forEach(g=>r.push([g.id,g.date,g.team?'Teams':'Individual',+g.fin,g.results.length,...g.names,...g.totals,...(g.teams||['','']),g.winner]));dl('joker_games.csv',csv(r))}
function stats(){const P={};G.filter(g=>g.fin).forEach(g=>g.names.forEach((n,p)=>{const k=n.toLowerCase(),o=P[k]=P[k]||{n,g:0,w:0,s:0,h:0,r:0};
  o.g++;o.s+=g.totals[p];if((' / '+g.winner+' ').toLowerCase().includes(n.toLowerCase())&&!g.team||g.team&&g.winner.toLowerCase().split(/ \/ | & /).includes(k))o.w++;
  g.results.forEach(x=>{o.r++;if(x.bids[p]==x.took[p])o.h++})}));
 const L=Object.values(P).sort((a,b)=>b.w-a.w||b.s/b.g-a.s/a.g);
 $('#app').innerHTML=`<div class="card"><h2>Statistics</h2><div class="mut" style="text-align:center;font-size:13px">${G.filter(g=>g.fin).length} finished games saved on this phone</div>
 <div class="tw" style="margin-top:8px"><table><tr><th>Player</th><th>Games</th><th>Wins</th><th>Avg total</th><th>Bid hit %</th></tr>
 ${L.map(o=>`<tr><td>${esc(o.n)}</td><td>${o.g}</td><td>${o.w}</td><td>${(o.s/o.g).toFixed(2)}</td><td>${o.r?Math.round(100*o.h/o.r):0}%</td></tr>`).join('')||'<tr><td colspan="5">No finished games yet</td></tr>'}</table></div>
 <button class="b wide" onclick="exportRounds()">Download rounds CSV</button><button class="b wide" onclick="exportGames()">Download games CSV</button>
 <button class="b gh wide" onclick="delAll()">Delete all saved games</button>
 <button class="b gh wide" onclick="S?render():setup()">← Back</button></div>`}
function tog(e){e.stopPropagation();$('#mn').hidden=!$('#mn').hidden}
document.addEventListener('click',()=>{$('#mn').hidden=true});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#mn').hidden=true});
function menu(w){$('#mn').hidden=true;if(w=='stats')stats();else newGame()}
async function newGame(){if(S&&S.results.length<24&&(S.results.length||S.bids.some(b=>b!=null))&&!(await box('Start a new game?\nThe current unfinished game will be lost.','Start new','Cancel')))return;localStorage.removeItem('joker_state');setup()}
S&&S.cfg?(render(),setTimeout(go,300)):setup();
</script></body></html>
