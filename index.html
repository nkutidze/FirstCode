table.sc td b{display:block;font-size:16px;line-height:1.15}

.tl{display:block;font-size:12px;font-weight:bold;letter-spacing:1px;color:#f2d479}
.pl{display:inline-block;font-style:normal;font-size:11px;font-weight:bold;padding:1px 7px;border-radius:10px;margin-top:2px}
.pl.up{background:#f2d479;color:#3a2f00}.pl.dn{background:#c0392b;color:#fff}

table.sc tr.live td:first-child{background:#ffefc4}
table.sc tr.live b{color:#b35a00}

<script>

'Penalty score':'ჯარიმის ქულა','100 × cards dealt':'სადაც დაგეწევა','Other number':'სხვა რიცხვი',
'Players':'მოთამაშეები','Player':'მოთამაშე','Start game':'თამაშის დაწყება','Please enter all 4 player names.':'გთხოვთ, შეიყვანეთ 4 მოთამაშის სახელი.','Each player needs a different name.':'თითოეულ მოთამაშეს განსხვავებული სახელი სჭირდება.',
'Game over':'თამაში დასრულდა','deals {0} card':'არიგებს {0} კარტს','deals {0} cards':'არიგებს {0} კარტს','TOTAL':'ჯამი','Part':'ნაწილი','Cards':'კარტი','Team':'გუნდი','TEAM':'გუნდი','cut':'ჩამოჭრა','taken':'აიღო',
'premia lost':'პრემია დაკარგულია','premia open':'პრემია ღიაა','★ ON PREMIA':'★ პრემიაზეა','★ PREMIA WON':'★ პრემია მოიგო','OVER':'წაგლეჯვა','EXTRA':'შეტენვა',
'{0} card will be cut from someone':'{0} კარტი ჩამოეჭრება ვინმეს','{0} cards will be cut from someone':'{0} კარტი ჩამოეჭრება ვინმეს','{0} card goes with someone':'{0} კარტი ვინმეს მიჰყვება','{0} cards go with someone':'{0} კარტი ვინმეს მიჰყვება',
'Next to bid: {0}':'შემდეგი თქმა: {0}','All bids are in. Play the round, then enter taken.':'ყველა განცხადება მიღებულია. ითამაშეთ რაუნდი, შემდეგ შეიყვანეთ აღებული.','Taken: {0} of {1}':'აღებული: {0} / {1}',
'↶ Undo':'↶ გაუქმება','Game finished':'თამაში დასრულდა','Enter bid: {0}':'ამბობს {0}','Enter taken: {0}':'აღებული: {0}',
'Cannot bid {0} (the bids would be full)':'ვერ დაასახელებთ {0}-ს (განცხადებები სრული იქნება)','Round {0} • {1} cards • bids {2}':'რაუნდი {0} • {1} კარტი • {2} ამბობს','1st':'1-ლი','2nd':'მე-2','3rd':'მე-3','4th':'მე-4',
'Round {0} • bid: {1} • {2} left':'რაუნდი {0} • განცხადება: {1} • დარჩა {2}','✓ Took as bid ({0})':'✓ აიღო განცხადებისამებრ ({0})','BID':'განცხადება','TAKEN':'აღებული','Cancel':'გაუქმება','place':'ადგილი','To 1st: {0}':'პირველამდე: {0}','Last place':'ბოლო ადგილი','Pass':'პასი','OK':'კარგი',
'Delete ALL saved games?':'ყველა შენახული თამაშის წაშლა?','Delete':'წაშლა','Start a new game?\nThe current unfinished game will be lost.':'დავიწყოთ ახალი თამაში?\nმიმდინარე დაუსრულებელი თამაში დაიკარგება.','Start new':'დაწყება',
'Tie! Both teams {0}':'ფრე! ორივე გუნდს {0} აქვს','Winner: {0} with {1}':'გამარჯვებული: {0} — {1}','Saved in Statistics.':'შენახულია სტატისტიკაში.',
'{0} finished games saved on this phone':'{0} დასრულებული თამაში შენახულია ამ ტელეფონზე','Games':'თამაშები','Wins':'გამარჯვებები','Avg total':'საშ. ჯამი','Bid hit %':'ზუსტი განცხადება %','No finished games yet':'დასრულებული თამაშები ჯერ არ არის',
'Download rounds CSV':'რაუნდების CSV ჩამოტვირთვა','Download games CSV':'თამაშების CSV ჩამოტვირთვა','Delete all saved games':'ყველა შენახული თამაშის წაშლა','← Back':'← უკან','To fill: {0}':'შესავსებად საჭიროა {0}','Filled':'შევსებულია','You are filled!':'მგონი იდრინგები','Edit':'შესწორება','Save':'შენახვა','Score':'ქულა','Round':'რაუნდი','Close':'დახურვა','says':'ამბობს','Deal':'დარიგება','Number of players':'მოთამაშეების რაოდენობა','4 players':'4 მოთამაშე','3 players':'3 მოთამაშე','Please enter all player names.':'გთხოვთ, შეიყვანეთ ყველა მოთამაშის სახელი.'};
function tr(s,...a){let r=(LANG==='ka'&&KA[s])||s;a.forEach((v,i)=>r=r.split('{'+i+'}').join(v));return r}
const menuHTML=()=>`<button onclick="menu('stats')">📊 ${tr('Statistics')}</button><button onclick="menu('new')">➕ ${tr('New game')}</button><button onclick="menu('lang')">🌐 ${LANG==='ka'?'English':'ქართული'}</button>`;
function setLang(){if(VIEW==='setup'&&$('#ty'))SV={pc:$('#pc').value,nm:[...document.querySelectorAll('.nm')].map(i=>i.value),ty:$('#ty').value,af:$('#af').value,pm:$('#pm').value,pe:$('#pe').value};
 LANG=LANG==='ka'?'en':'ka';localStorage.setItem('joker_lang',LANG);document.documentElement.lang=LANG;$('#mn').innerHTML=menuHTML();
 if(VIEW==='stats')stats();else if(VIEW==='game'&&S)render();else setup()}
const PARTS=[[1,2,3,4,5,6,7,8],[9,9,9,9],[8,7,6,5,4,3,2,1],[9,9,9,9]],R=[];
PARTS.forEach((p,i)=>p.forEach((c,j)=>R.push({n:R.length+1,part:i,cards:c,last:j==p.length-1})));
const $=s=>document.querySelector(s),ORD=['1st','2nd','3rd','4th'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>{let t=(v/100).toFixed(2).replace(/0+$/,'').replace(/\.$/,'');return t=='-0'||t==''?'0':t};
const bl=n=>n==0?tr('Pass'):''+n,sum=a=>a.reduce((x,y)=>x+(y||0),0),team=v=>[v[0]+v[2],v[1]+v[3]];
const order=r=>{const n=S.cfg.names.length;return[...Array(n).keys()].map(s=>(r+1+s)%n)};
const score=(b,t,c,pen)=>b>0&&t==0?-pen:b!=t?t*10:b==0?50:b==c?c*100:100+(b-1)*50;
const balText=(a,c)=>a>c?tr('OVER')+' '+(a-c):a<c?tr('EXTRA')+' '+(c-a):'';
const pill=a=>a>0?`<i class="pl up">+${fmt(a)} ★</i>`:a<0?`<i class="pl dn">${fmt(a)} ${tr('cut')}</i>`:'';
const td=(r,x,j)=>r.k=='t'?`<td><b>${x.v}</b>${pill(x.a)}</td>`
 :r.k=='l'?`<td><b>${x.b==null?'·':bl(x.b)}</b><small>${x.t==null?tr('taken')+' …':tr('taken')+' '+x.t}</small></td>`
 :`<td class="ed ${x.b==x.t?'hit':'miss'}" onclick="editCell(${r.i},${j})"><b>${x.s}</b><small>${bl(x.b)} / ${x.t}</small></td>`;
function tableHTML(rows,N,T){
 const head=N.map((n,p)=>`<th><span class="pn">${esc(n)}</span>${T?`<small>${tr('Team')} ${p%2+1}</small>`:''}</th>`).join('')+'';
 const body=rows.map(r=>`<tr class="${r.k=='t'?'tot':r.k=='l'?'live':''}"><td>${r.k=='t'?`<span class="tl">${tr('TOTAL')}</span><small>${r.sub}</small>`:`<span class="bd">${r.c}</span>`}</td>${r.cells.map((x,j)=>td(r,x,j)).join('')}</tr>`).join('');
 return`<table class="sc"><thead><tr><th>${tr('Deal')}</th>${head}</tr></thead><tbody>${body}</tbody></table>`}
function adj(ps,hs,aff,tm){const n=ps.length,pr=[...Array(n).keys()].filter(p=>hs[p].length&&hs[p].every(x=>x)),a=Array(n).fill(0);
 pr.forEach(p=>a[p]=Math.max(...ps[p]));
 const cut=p=>{const c=aff?ps[p]:ps[p].slice(0,-1);return Math.max(...(c.length?c:ps[p]))};
 if(tm){const ts=new Set(pr.map(p=>p%2));if(ts.size==1){const w=[...ts][0];for(let p=0;p<n;p++)if(p%2!=w)a[p]=-cut(p)}}
 else if(pr.length==1)for(let p=0;p<n;p++)if(p!=pr[0])a[p]=-cut(p);
 return a}
let S=null,G=JSON.parse(localStorage.getItem('joker_games')||'[]');
const keep=()=>localStorage.setItem('joker_state',JSON.stringify(S));
try{S=JSON.parse(localStorage.getItem('joker_state'))}catch(e){}
function box(msg,yes,no){return new Promise(res=>{const ov=$('#ov');ov.hidden=false;
 ov.innerHTML=`<div class="dlg"><div style="white-space:pre-line;margin:6px 0 14px;font-size:16px">${esc(msg)}</div><div class="row"><button class="b" id="by">${yes||tr('OK')}</button>${no?`<button class="b gh" id="bn">${no}</button>`:''}</div></div>`;
 const c=v=>{ov.hidden=true;ov.innerHTML='';res(v)};$('#by').onclick=()=>c(true);if(no)$('#bn').onclick=()=>c(false)})}
async function delAll(){if(await box(tr('Delete ALL saved games?'),tr('Delete'),tr('Cancel'))){G=[];localStorage.removeItem('joker_games');stats()}}
const seg=(id,o,d)=>`<input type="hidden" id="${id}" value="${d}"><div class="seg" id="${id}s">${o.map(([v,l])=>`<button type="button" data-v="${v}" class="${v==d?'on':''}" onclick="pick('${id}','${v}')">${l}</button>`).join('')}</div>`;
function pick(id,v){$('#'+id).value=v;document.querySelectorAll('#'+id+'s button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));if(id=='pc')pcShow()}
function pcShow(){const n=+$('#pc').value;document.querySelectorAll('.nm').forEach((e,i)=>e.style.display=i>=n?'none':'');const tb=document.querySelector('#tys button[data-v="Teams"]');if(tb)tb.style.display=n==3?'none':'';$('#tnote').style.display=n==3?'none':'';if(n==3)pick('ty','Individual')}
function penShow(){const m=$('#pm').value,v=$('#pe').value;document.querySelectorAll('#pbs button').forEach(b=>b.classList.toggle('on',m=='c'?b.dataset.v=='c':b.dataset.v==v));$('#pe').disabled=m=='c'}
function penPick(m,v){$('#pm').value=m;if(m=='f')$('#pe').value=v;penShow()}
function penType(){$('#pm').value='f';penShow()}
function setup(){VIEW='setup';S=null;$('#app').innerHTML=`<div class="card"><h2>${tr('Game rules')}</h2>
<label>${tr('Number of players')}</label>${seg('pc',[['4',tr('4 players')],['3',tr('3 players')]],'4')}
<label>${tr('Game type')}</label>${seg('ty',[['Individual',tr('Individual')],['Teams',tr('Teams')]],'Individual')}
<div class="mut" id="tnote" style="font-size:12px">${tr('Teams: Player 1 & 3 vs Player 2 & 4')}</div>
<label>${tr('Last score rule')}</label>${seg('af',[['1',tr('Affected')],['0',tr('Not affected')]],'1')}
<label>${tr('Penalty score')}</label><input type="hidden" id="pm" value="f"><div class="seg wrap" id="pbs">${[200,300,400].map(v=>`<button type="button" data-v="${v}" class="${v==200?'on':''}" onclick="penPick('f',${v})">${v}</button>`).join('')}<button type="button" data-v="c" onclick="penPick('c')">${tr('100 × cards dealt')}</button></div>
<input id="pe" type="number" value="200" min="0" step="10" placeholder="${tr('Other number')}" oninput="penType()" style="margin-top:6px">
<label>${tr('Players')}</label>${[1,2,3,4].map(i=>`<input class="nm" placeholder="${tr('Player')} ${i}" style="margin:3px 0">`).join('')}
<button class="b wide" onclick="start()">${tr('Start game')}</button></div>`;
 if(SV){pick('pc',SV.pc||'4');document.querySelectorAll('.nm').forEach((e,i)=>e.value=SV.nm[i]||'');pick('ty',SV.ty);pick('af',SV.af);$('#pm').value=SV.pm;$('#pe').value=SV.pe;penShow();SV=null}}
function start(){const n=[...document.querySelectorAll('.nm')].slice(0,+$('#pc').value).map(i=>i.value.trim());
 if(n.includes(''))return box(tr('Please enter all player names.'));
 if(new Set(n.map(x=>x.toLowerCase())).size<n.length)return box(tr('Each player needs a different name.'));
 S={cfg:{team:$('#ty').value=='Teams'&&n.length==4,aff:$('#af').value=='1',pen:+$('#pe').value||0,penCards:$('#pm').value=='c',names:n},results:[],bids:n.map(()=>null),took:n.map(()=>null),log:[],id:Date.now(),date:new Date().toISOString().slice(0,16).replace('T',' ')};
 keep();render();setTimeout(go,300)}
function calc(){const n=S.cfg.names.length,rows=[],tot=Array(n).fill(0),mk=()=>Array.from({length:n},()=>[]);let ps=mk(),hs=mk();
 S.results.forEach((r,i)=>{const I=R[i],cells=[];
  for(let p=0;p<n;p++){ps[p].push(r.scores[p]);hs[p].push(r.bids[p]==r.took[p]);tot[p]+=r.scores[p];cells.push({b:r.bids[p],t:r.took[p],s:r.scores[p]})}
  rows.push({k:'r',i,c:I.cards,cells,t:team(r.scores)});
  if(I.last){const a=adj(ps,hs,S.cfg.aff,S.cfg.team),pt=[],cs=[];
   for(let p=0;p<n;p++){tot[p]+=a[p];const v=sum(ps[p])+a[p];pt.push(v);cs.push({v:fmt(v),a:a[p]})}
   rows.push({k:'t',c:'TOTAL',sub:tr('Part')+' '+(I.part+1),cells:cs,t:team(pt).map(fmt)});ps=mk();hs=mk()}});
 return{rows,tot}}
function nextStep(){const o=order(S.results.length);for(const p of o)if(S.bids[p]==null)return['bid',p];
 for(const p of o)if(S.took[p]==null)return['took',p];return null}
function render(){VIEW='game';const N=S.cfg.names,T=S.cfg.team,k=S.results.length,done=k>=24,{rows,tot}=calc();
 if(!done&&S.bids.some(b=>b!=null)){rows.push({k:'l',c:R[k].cards,cells:S.bids.map((_,p)=>({b:S.bids[p],t:S.took[p]})),t:['','']})}
 const part=R[Math.min(k,23)].part,tt=team(tot);
 const rk=tot.map(v=>1+tot.filter(x=>x>v).length),mn=Math.min(...tot),same=tot.every(v=>v==tot[0]);
 const rb=p=>{if(!k||same||T)return'';const last=tot[p]==mn,r=rk[p],top=Math.max(...tot);return (last?`<span class="rp rl">🔻</span>`:`<span class="rp r${r}">${['🥇','🥈','🥉'][r-1]}</span>`)};
 const gc=p=>(!k||same||T||rk[p]==1)?'':`<div class="gi">${tr('To 1st: {0}','<b>'+fmt(Math.max(...tot)-tot[p])+'</b>')}</div>`;
 const hd=`<div class="deal"><span class="ic">🃏</span><div>${done?`<b>${tr('Game over')}</b>`:`<b>${esc(N[k%N.length])}</b><small>${tr(R[k].cards==1?'deals {0} card':'deals {0} cards',R[k].cards)}</small>`}</div></div>`,tbl=`<div class="tw">${tableHTML(rows,N,T)}</div>`;let tm='';
 if(T){const mx=Math.max(...tt);tm=`<div class="teams">${[0,1].map(t=>`<div class="tc"><span class="tn">${tr('TEAM')} ${t+1} · ${esc(N[t])} &amp; ${esc(N[t+2])}</span><b style="${tt[t]==mx?'':'color:#1a1a1a'}">${fmt(tt[t])}</b>${tt[t]<mx?`<span class="tg">${tr('To 1st: {0}','<b>'+fmt(mx-tt[t])+'</b>')}</span>`:''}</div>`).join('')}</div>`}
 const bx=`<div class="boxes" style="grid-template-columns:repeat(${N.length},1fr)">`+N.map((n,p)=>{const m=[];R.forEach((I,i)=>{if(I.part==part)m.push(i>=k?'o':S.results[i].bids[p]==S.results[i].took[p]?'h':'x')});
  const st=m.includes('x')?[tr('premia lost'),'lost']:!m.includes('h')?[tr('premia open'),'open']:m.includes('o')?[tr('★ ON PREMIA'),'on']:[tr('★ PREMIA WON'),'on'];
  return`<div class="box ${st[1]}"><div class="rk">${rb(p)}</div><div class="bn">${esc(n)}</div><b>${fmt(tot[p])}</b><div class="pips">${m.map(x=>`<i class="${x}"></i>`).join('')}</div>${gc(p)}</div>`}).join('')+'</div>';
 const st=done?null:nextStep();let bal='';
 if(st&&S.bids.every(b=>b!=null)){const d=sum(S.bids)-R[k].cards;if(d){const t=balText(sum(S.bids),R[k].cards),n=Math.abs(d),over=d>0,c=over?'#c0392b':'#1565c0';
  bal=`<div class="bal" style="color:${c};background:${over?'#fdecea':'#e8f1fb'};border-color:${c}">${t}</div>`}}
 let h=tm+bx+(bal?`<div class="dealrow">${bal}</div>`:'')+tbl+`<div id="hint">${done?'':st[0]=='bid'?tr('Next to bid: {0}',esc(N[st[1]])):sum(S.took)==0?tr('All bids are in. Play the round, then enter taken.'):tr('Taken: {0} of {1}',sum(S.took),R[k].cards)}</div>
<div class="row"><button class="b gh" onclick="undo()">${tr('↶ Undo')}</button><button class="b" onclick="go()" ${done?'disabled':''}>${done?tr('Game finished'):st[0]=='bid'?tr('Enter bid: {0}',esc(N[st[1]])):tr('Enter taken: {0}',esc(N[st[1]]))}</button></div>`;
 $('#app').innerHTML=h;const w=$('.tw');if(w)w.scrollTop=w.scrollHeight}
function ask(kind,p){return new Promise(res=>{const k=S.results.length,I=R[k],c=I.cards,o=order(k),N=S.cfg.names,dis=new Set();
 let note='',sub,extra='',fi='',cls='';
 if(kind=='bid'){if(p==o[o.length-1]){const b=c-sum(o.slice(0,-1).map(q=>S.bids[q]));if(b>=0&&b<=c){dis.add(b)}}
  sub='';
  const ix=o.indexOf(p),rem=c-sum(o.slice(0,ix).map(q=>S.bids[q]));
  if(ix<o.length-1){fi=rem>0?tr('To fill: {0}',rem):'⚠ '+tr('Filled');cls=rem>0?'':' warn'}else if(rem==0){fi='⚠ '+tr('You are filled!');cls=' bad'}}
 else{const rem=c-sum(S.took);for(let n=rem+1;n<=c;n++)dis.add(n);const bal=balText(sum(S.bids),c),b=S.bids[p];
  sub='';
  extra=`<button class="b" data-v="${b}" ${dis.has(b)?'disabled':''}>✓ ${bl(b)}</button>`}
 const ov=$('#ov');ov.hidden=false;
 ov.innerHTML=`<div class="dlg${cls}"><h3>${esc(kind=='bid'||LANG!=='ka'?N[p]:N[p]+(/[აეიოუ]$/.test(N[p])?'მ':'მა'))}${S.cfg.team?' ('+tr('Team')+' '+(p%2+1)+')':''}${kind=='bid'?' '+tr('says'):LANG==='ka'?' წაიღო':' – '+tr('TAKEN')}</h3>${sub?`<div style="font-style:italic;margin-top:4px">${sub}</div>`:''}${fi?`<div class="fi${cls}">${fi}</div>`:''}<div class="note">${note}</div>
 <div class="grid">${extra}${Array.from({length:c+1},(_,n)=>kind=='took'&&n==S.bids[p]?'':`<button class="b${kind=='took'?' sec':''}" data-v="${n}" ${dis.has(n)?'disabled':''}>${bl(n)}</button>`).join('')}</div>
 <button class="b gh wide" data-v="x">${tr('Cancel')}</button></div>`;
 const close=v=>{document.removeEventListener('keydown',key);ov.hidden=true;ov.innerHTML='';res(v)};
 const key=e=>{if(e.key=='Escape')close(null);else if(/^\d$/.test(e.key)&&+e.key<=c&&!dis.has(+e.key))close(+e.key)};
 document.addEventListener('keydown',key);
 ov.querySelectorAll('button').forEach(b=>b.onclick=()=>b.dataset.v=='x'?close(null):close(+b.dataset.v))})}
let DEALSHOWN=-1;
function dealPopup(k){return new Promise(res=>{const ov=$('#ov'),N=S.cfg.names,c=R[k].cards;ov.hidden=false;
 ov.innerHTML=`<div class="dlg"><div class="mut" style="font-weight:bold;margin-bottom:8px">${tr('Deal')} ${R[k].n}</div><div class="deal" style="margin:0 0 14px"><span class="ic">🃏</span><div style="text-align:left;font-size:17px;font-weight:bold">${esc(N[k%N.length])} ${tr(c==1?'deals {0} card':'deals {0} cards',c)}</div></div><button class="b wide" id="dc">${tr('Close')}</button></div>`;
 const close=()=>{document.removeEventListener('keydown',key);ov.hidden=true;ov.innerHTML='';res()};
 const key=e=>{if(e.key=='Escape'||e.key=='Enter')close()};
 document.addEventListener('keydown',key);$('#dc').onclick=close})}
async function go(){if(!S||S.results.length>=24||!$('#ov').hidden)return;let st=nextStep();if(!st)return;const ph=st[0];
 if(ph=='bid'&&S.bids.every(b=>b==null)&&DEALSHOWN!=S.results.length){DEALSHOWN=S.results.length;await dealPopup(S.results.length)}
 while(st&&st[0]==ph){const[k,p]=st,v=await ask(k,p);if(v==null)break;
  if(k=='bid'){S.bids[p]=v;S.log.push(['bid',p,0])}else{S.took[p]=v;S.log.push(['took',p,0]);autofill()}
  if(!S.took.includes(null)){finish();return}keep();render();st=nextStep()}}
function autofill(){const c=R[S.results.length].cards,e=order(S.results.length).filter(p=>S.took[p]==null);if(!e.length)return;
 if(sum(S.took)==c)e.forEach(p=>{S.took[p]=0;S.log.push(['took',p,1])});
 else if(e.length==1){S.took[e[0]]=c-sum(S.took);S.log.push(['took',e[0],1])}}
function finish(){const I=R[S.results.length];
 S.results.push({bids:[...S.bids],took:[...S.took],scores:S.bids.map((b,p)=>score(b,S.took[p],I.cards,S.cfg.penCards?100*I.cards:S.cfg.pen)),log:[...S.log]});
 S.bids=S.bids.map(()=>null);S.took=S.took.map(()=>null);S.log=[];keep();render();
 if(S.results.length==24){save(true);const{tot}=calc(),N=S.cfg.names;let m;
  if(S.cfg.team){const t=team(tot),b=Math.max(...t),w=[0,1].filter(i=>t[i]==b).map(i=>N[i]+' & '+N[i+2]);m=w.length==2?tr('Tie! Both teams {0}',fmt(b)):tr('Winner: {0} with {1}',w[0],fmt(b))}
  else{const b=Math.max(...tot);m=tr('Winner: {0} with {1}',N.filter((n,i)=>tot[i]==b).join(', '),fmt(b))}
  setTimeout(()=>box(m+'\n\n'+tr('Saved in Statistics.')),100)}else setTimeout(go,300)}
function editCell(i,p){const ov=$('#ov');if(!ov.hidden)return;
 const r=S.results[i],c=R[i].cards,N=S.cfg.names,pen=S.cfg.penCards?100*c:S.cfg.pen;let b=r.bids[p],t=r.took[p];
 const row=(k,v)=>`<div class="grid">${Array.from({length:c+1},(_,n)=>`<button class="b${n==v?'':' sec'}" data-k="${k}" data-v="${n}">${bl(n)}</button>`).join('')}</div>`;
 ov.hidden=false;
 ov.innerHTML=`<div class="dlg"><h3>${esc(N[p])} • ${c} ${tr('Cards')}</h3>
 <div style="font-weight:bold;margin-top:8px;color:#5c6b64">${tr('BID')}</div>${row('b',b)}
 <div style="font-weight:bold;color:#5c6b64">${tr('TAKEN')}</div>${row('t',t)}
 <div class="fi" id="ei"></div><div class="note" id="en"></div>
 <div class="row" style="margin-top:10px"><button class="b" id="es">${tr('Save')}</button><button class="b gh" id="ec">${tr('Cancel')}</button></div></div>`;
 const info=()=>{$('#ei').textContent=tr('Score')+': '+fmt(score(b,t,c,pen));const ts=sum(r.took.map((x,q)=>q==p?t:x));$('#en').textContent=ts==c?'':tr('Taken: {0} of {1}',ts,c)};
 info();
 ov.querySelectorAll('button[data-k]').forEach(el=>el.onclick=()=>{const k=el.dataset.k,v=+el.dataset.v;if(k=='b')b=v;else t=v;
  ov.querySelectorAll('button[data-k="'+k+'"]').forEach(x=>x.classList.toggle('sec',+x.dataset.v!=v));info()});
 const close=()=>{ov.hidden=true;ov.innerHTML=''};
 $('#ec').onclick=close;
 $('#es').onclick=()=>{r.bids[p]=b;r.took[p]=t;r.scores[p]=score(b,t,c,pen);close();keep();if(S.results.length==24)save(true);render()}}
function undo(){if(!S)return;if(!S.log.length&&S.results.length){const r=S.results.pop();S.bids=[...r.bids];S.took=[...r.took];S.log=[...r.log]}
 while(S.log.length){const[k,p,a]=S.log.pop();S[k=='bid'?'bids':'took'][p]=null;if(!a)break}keep();render()}
function save(fin){const{tot}=calc(),N=S.cfg.names,t=team(tot),b=Math.max(...(S.cfg.team?t:tot));
 const g={id:S.id,date:S.date,team:S.cfg.team,fin,names:N,pen:S.cfg.pen,aff:S.cfg.aff,results:S.results.map((r,i)=>({n:R[i].n,part:R[i].part+1,cards:R[i].cards,bids:r.bids,took:r.took,scores:r.scores})),
  totals:tot.map(v=>v/100),teams:S.cfg.team?t.map(v=>v/100):null,
  winner:S.cfg.team?[0,1].filter(i=>t[i]==b).map(i=>N[i]+' & '+N[i+2]).join(' / '):N.filter((n,i)=>tot[i]==b).join(' / ')};
 G=G.filter(x=>x.id!=g.id);G.push(g);localStorage.setItem('joker_games',JSON.stringify(G))}
function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')}
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv'}));a.download=name;a.click()}
function exportRounds(){const r=[['game_id','date','game_type','round','part','cards','player','seat','team','bid','took','hit','score']];
 G.forEach(g=>g.results.forEach(x=>g.names.forEach((n,p)=>r.push([g.id,g.date,g.team?'Teams':'Individual',x.n,x.part,x.cards,n,p+1,g.team?p%2+1:'',x.bids[p],x.took[p],+(x.bids[p]==x.took[p]),x.scores[p]]))));dl('joker_rounds.csv',csv(r))}
function exportGames(){const r=[['game_id','date','game_type','finished','rounds_played','player1','player2','player3','player4','total_p1','total_p2','total_p3','total_p4','team1_total','team2_total','winner']];
 G.forEach(g=>r.push([g.id,g.date,g.team?'Teams':'Individual',+g.fin,g.results.length,...[0,1,2,3].map(i=>g.names[i]||''),...[0,1,2,3].map(i=>g.totals[i]??''),...(g.teams||['','']),g.winner]));dl('joker_games.csv',csv(r))}
function stats(){VIEW='stats';const P={};G.filter(g=>g.fin).forEach(g=>g.names.forEach((n,p)=>{const k=n.toLowerCase(),o=P[k]=P[k]||{n,g:0,w:0,s:0,h:0,r:0};
  o.g++;o.s+=g.totals[p];if((' / '+g.winner+' ').toLowerCase().includes(n.toLowerCase())&&!g.team||g.team&&g.winner.toLowerCase().split(/ \/ | & /).includes(k))o.w++;
  g.results.forEach(x=>{o.r++;if(x.bids[p]==x.took[p])o.h++})}));
 const L=Object.values(P).sort((a,b)=>b.w-a.w||b.s/b.g-a.s/a.g);
 $('#app').innerHTML=`<div class="card"><h2>${tr('Statistics')}</h2><div class="mut" style="text-align:center;font-size:13px">${tr('{0} finished games saved on this phone',G.filter(g=>g.fin).length)}</div>
 <div class="tw" style="margin-top:8px"><table><tr><th>${tr('Player')}</th><th>${tr('Games')}</th><th>${tr('Wins')}</th><th>${tr('Avg total')}</th><th>${tr('Bid hit %')}</th></tr>
 ${L.map(o=>`<tr><td>${esc(o.n)}</td><td>${o.g}</td><td>${o.w}</td><td>${(o.s/o.g).toFixed(2)}</td><td>${o.r?Math.round(100*o.h/o.r):0}%</td></tr>`).join('')||`<tr><td colspan="5">${tr('No finished games yet')}</td></tr>`}</table></div>
 <button class="b wide" onclick="exportRounds()">${tr('Download rounds CSV')}</button><button class="b wide" onclick="exportGames()">${tr('Download games CSV')}</button>
 <button class="b gh wide" onclick="delAll()">${tr('Delete all saved games')}</button>
 <button class="b gh wide" onclick="S?render():setup()">${tr('← Back')}</button></div>`}
function tog(e){e.stopPropagation();$('#mn').hidden=!$('#mn').hidden}
document.addEventListener('click',()=>{$('#mn').hidden=true});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#mn').hidden=true});
function menu(w){$('#mn').hidden=true;if(w=='stats')stats();else if(w=='lang')setLang();else newGame()}
async function newGame(){if(S&&S.results.length<24&&(S.results.length||S.bids.some(b=>b!=null))&&!(await box(tr('Start a new game?\nThe current unfinished game will be lost.'),tr('Start new'),tr('Cancel'))))return;localStorage.removeItem('joker_state');setup()}
$('#mn').innerHTML=menuHTML();
S&&S.cfg?(render(),setTimeout(go,300)):setup();
</script></body></html>
